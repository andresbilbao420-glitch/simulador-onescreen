<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneScreen TL7 | Plataforma Educativa</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="grid-overlay"></div>

<div class="container">

<header class="header">

    <div class="logo-bar">
        <img src="public/onescreen-logo.png" alt="Logo" class="logo">
    </div>

    <h1 class="title">OneScreen TL7</h1>
    <p class="subtitle">Selecciona tu perfil y comienza tu experiencia de aprendizaje</p>

</header>

<div class="button-group">
    <button class="btn" onclick="cargar('docente')">👨‍🏫 Docente</button>
    <button class="btn" onclick="cargar('estudiante')">🎓 Estudiante</button>
</div>

<div id="contenido" class="content-area">
    <h3 id="titulo"></h3>

    <p class="info">
        Si la encuesta no carga, 
        <a id="link" href="#" target="_blank">haz clic aquí</a>
    </p>

    <iframe id="formulario"></iframe>

    <button class="btn btn-confirmar" onclick="activarSimulador()">
        ✅ Ya completé la encuesta
    </button>

     <div class="simulador-box">
        <p>Completa la encuesta para acceder al simulador:</p>
        <button id="simulador" class="btn btn-simulador">
    🚀 Abrir Simulador
        </button>
    </div>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
